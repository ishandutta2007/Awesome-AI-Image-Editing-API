<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="secondary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blur-bg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    
    <filter id="drop-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-gradient)"/>

  <!-- Dynamic Animated Glowing Orbs (Background Layer) -->
  <g filter="url(#blur-bg)">
    <circle cx="200" cy="100" r="180" fill="url(#primary-glow)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;180;80" dur="10s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="1000" cy="220" r="200" fill="url(#secondary-glow)">
      <animate attributeName="cx" values="1020;880;1020" dur="15s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;120;220" dur="11s" repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="280" r="140" fill="#ec4899" opacity="0.4">
      <animate attributeName="r" values="120;170;120" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Modern Grid Mesh Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200" />
    <path d="M80,0 V320 M160,0 V320 M240,0 V320 M320,0 V320 M400,0 V320 M480,0 V320 M560,0 V320 M640,0 V320 M720,0 V320 M800,0 V320 M880,0 V320 M960,0 V320 M1040,0 V320 M1120,0 V320" />
  </g>

  <!-- Animated Floating AI Sparkle / Nodes -->
  <g fill="#a855f7" opacity="0.7">
    <circle cx="120" cy="80" r="3">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1080" cy="90" r="4">
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="240" r="3">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="230" r="5">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Glassmorphic Container for Crisp Text & Title -->
  <rect x="50" y="35" width="1100" height="250" rx="16" fill="#0f172a" fill-opacity="0.55" stroke="url(#card-border)" stroke-width="1.5" filter="url(#drop-shadow)" />

  <!-- Content Group (Ensured in Foreground) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 70)">
      <rect width="250" height="30" rx="15" fill="#6366f1" fill-opacity="0.25" stroke="#818cf8" stroke-width="1"/>
      <text x="125" y="20" fill="#c7d2fe" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="0.5">
        ✨ CURATED ECOSYSTEM 2026
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#text-gradient)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-1" filter="url(#drop-shadow)">
      Awesome AI Image Editing API
    </text>

    <!-- Subtitle -->
    <text x="0" y="185" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Production SaaS APIs &amp; Open-Source Pipelines for Background Removal, Inpainting &amp; Generative Edits
    </text>

    <!-- Tags / Highlights -->
    <g transform="translate(0, 218)" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="80" y="21" fill="#38bdf8" text-anchor="middle">⚡ High-Speed SaaS</text>

      <!-- Tag 2 -->
      <rect x="172" y="0" width="170" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="257" y="21" fill="#c084fc" text-anchor="middle">✂️ Background Erase</text>

      <!-- Tag 3 -->
      <rect x="354" y="0" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="434" y="21" fill="#4ade80" text-anchor="middle">🎨 Generative Inpaint</text>

      <!-- Tag 4 -->
      <rect x="526" y="0" width="180" height="32" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="616" y="21" fill="#f43f5e" text-anchor="middle">🚀 Self-Hosted Models</text>
    </g>
  </g>
</svg>
